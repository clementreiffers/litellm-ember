name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un nouveau push rend obsolète la release du commit précédent, notamment si
# les workflows changent : GITHUB_TOKEN ne peut pas taguer cet ancien workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Le backend dépend du Trousseau et des API macOS (keyring, window-vibrancy).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify release analysis and changelog generation
        run: npm test
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test -p ember -p shared --locked
      - run: cargo test -p ui --locked
      - run: cargo clippy -p ember -p shared --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy -p ui --target wasm32-unknown-unknown --all-targets --all-features --locked -- -D warnings

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    env:
      NO_COLOR: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-universal
      - name: Publish semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
