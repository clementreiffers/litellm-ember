name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Le backend dépend du Trousseau et des API macOS (keyring, window-vibrancy).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ember -p shared
      - run: cargo clippy -p ember -p shared --all-targets
