name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Le backend dépend du Trousseau et des API macOS (keyring, window-vibrancy).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ember -p shared --locked
      - run: cargo clippy -p ember -p shared --all-targets --locked

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      NO_COLOR: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-universal
      - name: Install build tools
        run: |
          cargo install tauri-cli --version '^2' --locked
          cargo install trunk --version 0.21.14 --locked
      - name: Set release version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path('src-tauri/tauri.conf.json').read_text())
          major, minor, _ = config['version'].split('.')
          version = f"{major}.{minor}.{os.environ['GITHUB_RUN_NUMBER']}"
          Path('release-config.json').write_text(json.dumps({'version': version}))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Build universal macOS application
        run: cargo tauri build --target universal-apple-darwin --config "$GITHUB_WORKSPACE/release-config.json" -- --locked
      - name: Package application
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            target/universal-apple-darwin/release/bundle/macos/Ember.app \
            "release/Ember-${VERSION}-macos-universal.zip"
          cd release
          shasum -a 256 "Ember-${VERSION}-macos-universal.zip" > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            "release/Ember-${VERSION}-macos-universal.zip" release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Ember $VERSION" \
            --generate-notes
