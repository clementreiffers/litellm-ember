[package]
name = "ember"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shared = { path = "../shared" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2.6.0"
tauri-plugin-updater = "2.13.3"
semver = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread", "net", "io-util", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls", "stream"] }
futures-util = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "NSScreen", "NSWindow", "NSGraphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSGeometry", "NSString", "NSValue"] }
window-vibrancy = "0.8.1"
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
httpmock = "0.7"
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["test-util"] }

[[bench]]
name = "aggregations"
harness = false
